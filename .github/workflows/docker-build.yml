name: Build and push Docker image

on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.2' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/go-file:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/go-file:${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.2' }}

      # 同步单架构标签，便于在镜像源/旧客户端不支持 manifest list 的机器上直接拉取
      - name: Push per-arch tags
        run: |
          docker buildx imagetools create --platform linux/amd64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/go-file:amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/go-file:latest
          docker buildx imagetools create --platform linux/arm64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/go-file:arm64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/go-file:latest
