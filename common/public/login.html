<!DOCTYPE html>
<html lang="zh-CN">
{{template "header" .}}
<body>
{{template "nav" .}}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">F</div>
        <h1>{{.option.WebsiteName}}</h1>
        <p class="sub">登录以管理你的资源库</p>
        {{if .message}}
        <article id="messageToast" class="message is-danger">
            <div class="message-body" id="messageToastText">
                {{.message}}
            </div>
        </article>
        {{end}}
        <form action="/login" method="post">
            <div class="field">
                <label class="label">用户名</label>
                <div class="control">
                    <input class="input" name="username" type="text" required autofocus placeholder="请输入用户名">
                </div>
            </div>
            <div class="field">
                <label class="label">密码</label>
                <div class="control">
                    <input class="input" name="password" type="password" required placeholder="请输入密码">
                </div>
            </div>
            <div class="buttons" style="margin-top: 22px">
                <button type="submit" class="button is-primary is-fullwidth">登录</button>
            </div>
        </form>
    </div>
</div>
{{template "footer" .}}
</body>
</html>
