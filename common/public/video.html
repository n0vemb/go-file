<!DOCTYPE html>
<html lang="zh-CN">
{{template "header" .}}
<body class="hide-scrollbar">
{{template "nav" .}}
<div class="page-shell">
    <div class="container">
        <article id="messageToast" class="message is-danger" style="display: none">
            <div class="message-body" id="messageToastText">

            </div>
        </article>
        {{template "progress"}}
        <div class="columns" style="margin-top: 12px">
            <div class="column is-four-fifths">
                <h2 class="subtitle" id="videoTitle">{{.videoName}}</h2>
                <video controls width="100%" id="videoPlayer">
                    <source src="{{.videoPath}}" id="videoSrc">
                </video>
            </div>
            <div class="column">
                <h5 class="subtitle is-5" style="margin-left: 12px; position: sticky">播放列表</h5>
                <div class="video-sidebar hide-scrollbar">

                    <table class="table is-fullwidth">
                        <tbody>
                        {{range $index, $file := .files}}
                        <tr style="font-size: smaller">
                            {{if $file.IsFolder }}
                            <td><a class="folder-link" href="{{$file.Link}}"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> {{$file.Name}}</a></td>
                            {{ else }}
                            <td><a class="file-link" onclick='playVideo("{{$file.Name}}", "{{$file.Link}}")'><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg> {{$file.Name}}</a></td>
                            {{ end }}
                        </tr>
                        {{end}}
                        </tbody>
                    </table>
                </div>
            </div>
            <script>
                async function playVideo(name, src) {
                    document.getElementById('videoSrc').src = src;
                    document.getElementById('videoTitle').innerText = name;
                    let player = document.getElementById('videoPlayer');
                    await player.load();
                    player.play();
                }
            </script>
        </div>
    </div>
</div>
{{template "footer" .}}

{{template "modal"}}
{{template "notice" .}}

</body>
</html>
